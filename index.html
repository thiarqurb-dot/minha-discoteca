<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1013">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pithifork">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}:root{color-scheme:light}</style>
<title>Pithifork</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: seções no topo (Artistas, Álbuns, Geral, Do ano). A entrada é uma grade de artistas com foto em círculo; cada artista abre seus álbuns em blocos com capa, faixas e nota. */
:root{
  --bg:#ECEFF2; --surface:#FFFFFF; --ink:#12181C; --muted:#586571; --line:#D3DAE0;
  --accent:#0F5C63; --on-accent:#FFFFFF; --accent-soft:#D6ECEE;
  --p1:#F2C35B; --p2:#C9CFD6; --p3:#D9A074; --p-ink:#1A1A1A;
  --danger:#B3261E; --ok:#1F8A5B; --warn:#B8700F; --mute:#9AA7B2;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1013; --surface:#141A1F; --ink:#E7EDF0; --muted:#8FA0AB; --line:#26323A;
    --accent:#52B6BE; --on-accent:#06262A; --accent-soft:#14343A;
    --p1:#F2C35B; --p2:#C3CAD2; --p3:#D9A074; --p-ink:#161616;
    --danger:#FF8A80; --ok:#4CC38A; --warn:#F0B04A; --mute:#6B7A86; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1013; --surface:#141A1F; --ink:#E7EDF0; --muted:#8FA0AB; --line:#26323A;
  --accent:#52B6BE; --on-accent:#06262A; --accent-soft:#14343A;
  --p1:#F2C35B; --p2:#C3CAD2; --p3:#D9A074; --p-ink:#161616;
  --danger:#FF8A80; --ok:#4CC38A; --warn:#F0B04A; --mute:#6B7A86; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font:15px/1.5 var(--f-body);
  padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Cabeçalho */
.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
.brand{min-width:0}
.brand h1{display:flex;align-items:center;gap:.35rem}
.brand .logo{width:1.5em;height:1em;color:var(--accent);flex:none}
.brand .dot{font-style:normal;color:#2f7bff}
.brand h1{font-size:clamp(1.8rem,4.5vw,2.5rem);font-weight:700;letter-spacing:-.02em;line-height:1.05}
.stats{margin:.35rem 0 0;color:var(--muted);font-size:.9rem;display:flex;flex-wrap:wrap;gap:.35rem .75rem;align-items:center}
.chip{font:500 .72rem var(--f-mono);border:1px solid var(--line);border-radius:99px;padding:.1rem .55rem;color:var(--muted);background:var(--surface)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0;flex:1 1 320px;justify-content:flex-end}
.in{width:100%;padding:.55rem .7rem;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
.tools .in{flex:1 1 220px;max-width:340px;min-width:0}
.btn{font:600 .875rem var(--f-body);padding:.55rem .95rem;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:.3rem .65rem;font-size:.8rem}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn[disabled]{opacity:.5;cursor:default}

/* Seções no topo */
.nav{display:flex;gap:26px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:22px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nv{flex:none;padding:.7rem 0;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--muted);font:600 1rem var(--f-body);cursor:pointer;margin-bottom:-1px}
.nv:hover{color:var(--ink)}
.nv.on{color:var(--accent);border-bottom-color:var(--accent)}

/* Títulos de seção */
.head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;margin:2px 0 16px}
.head h2{font-size:clamp(1.4rem,3.4vw,1.9rem);font-weight:700;letter-spacing:-.015em}
.sub{color:var(--muted);margin:0;font-size:.9rem}
.sel{padding:.45rem .6rem;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:600 .9rem var(--f-body)}

/* Artistas: foto em círculo e nome */
.artists,.covers{--n:3;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr))}
.artists{gap:20px 12px}
.c4{--n:4!important}.c6{--n:6!important}
.art{display:grid;align-content:start;gap:.1rem;border:0;background:transparent;color:var(--ink);padding:0;text-align:left;cursor:pointer;min-width:0;font:inherit}
.art .avatar{margin-bottom:.4rem}
.art:hover .avatar{outline:3px solid var(--accent);outline-offset:2px}
.art b{font:600 .8rem/1.25 var(--f-body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.art span{font:500 .68rem var(--f-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{display:block;width:100%;aspect-ratio:1;border-radius:50%;object-fit:cover;background:var(--cor)}
.avatar.ph{display:grid;place-items:center;color:var(--on-cor);font:700 clamp(1.1rem,5vw,2rem) var(--f-display)}

/* Álbuns: grade de capas */
.covers{gap:18px 12px}
.cv{display:grid;align-content:start;gap:.1rem;border:0;background:transparent;color:var(--ink);padding:0;text-align:left;cursor:pointer;min-width:0;font:inherit}
.cv .cover{border-radius:4px;margin-bottom:.4rem}
.covers.rd .cv .cover{border-radius:50%}
.cv:hover .cover{outline:3px solid var(--accent);outline-offset:2px}
.cv b{font:600 .82rem/1.25 var(--f-body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cv span{font:500 .7rem var(--f-mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Página do artista */
.back{border:0;background:transparent;color:var(--accent);font:600 .9rem var(--f-body);cursor:pointer;padding:0;margin-bottom:12px}
.art-head{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:center;margin-bottom:20px}
.art-head .avatar{width:88px;flex:none}
.art-head .who{min-width:0;flex:1 1 200px}
.art-head h2{font-size:clamp(1.5rem,4vw,2.1rem);font-weight:700;letter-spacing:-.015em;overflow-wrap:anywhere}
.art-head .acts{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem}

/* Pódio */
.podium{width:min(100%,440px);border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface);margin-bottom:20px}
.podium h3{padding:.55rem .75rem;background:var(--accent);color:var(--on-accent);font:700 .76rem var(--f-body);letter-spacing:.14em;text-transform:uppercase;text-align:center}
.pod-row{display:grid;grid-template-columns:2.2rem minmax(0,1fr) auto;align-items:center;gap:.6rem;width:100%;padding:.55rem .75rem;border:0;border-top:1px solid var(--line);color:var(--p-ink);text-align:left;cursor:pointer;font:inherit}
.pod-row.p1{background:var(--p1)} .pod-row.p2{background:var(--p2)} .pod-row.p3{background:var(--p3)}
.pod-row:hover{filter:brightness(.97)}
.medal{width:1.6rem;height:1.6rem;border-radius:50%;display:grid;place-items:center;font:500 .8rem var(--f-mono);background:var(--surface);color:var(--ink)}
.pod-t{min-width:0;overflow-wrap:anywhere;font-weight:600}
.pod-t small{display:block;font-weight:500;opacity:.75}
.pod-n{font:500 .95rem var(--f-mono);font-variant-numeric:tabular-nums}

/* Ranking */
.ranking{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.row{display:grid;grid-template-columns:2.2rem 44px minmax(0,1fr) auto;align-items:center;gap:.7rem;width:100%;padding:.55rem .8rem;border:0;border-top:1px solid var(--line);background:transparent;color:var(--ink);text-align:left;cursor:pointer;font:inherit}
.row:first-child{border-top:0}
.row:hover{background:var(--accent-soft)}
.row .pos{font:500 .85rem var(--f-mono);color:var(--muted);text-align:center}
.row .tx{min-width:0;overflow-wrap:anywhere}
.row .tx b{display:block;font-weight:600}
.row .tx span{color:var(--muted);font-size:.85rem}
.row .nt{font:500 1rem var(--f-mono);font-variant-numeric:tabular-nums}
.none{padding:1.2rem;color:var(--muted);text-align:center}

/* Capas */
.cover{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:var(--cor)}
.cover.ph{display:grid;place-items:center;color:var(--on-cor);font:700 1.9rem var(--f-display);
  background:
    radial-gradient(circle at 50% 50%,transparent 0 20%,rgba(0,0,0,.22) 21% 22%,transparent 23% 36%,rgba(0,0,0,.16) 37% 38%,transparent 39% 52%,rgba(0,0,0,.12) 53% 54%,transparent 55%),
    var(--cor)}
.cover.thumb{width:44px;height:44px;border-radius:4px;font-size:.95rem}
.cover.big{font-size:3rem}

/* Bloco de álbum */
.albums{display:grid;gap:22px}
.album{display:grid;grid-template-columns:190px minmax(0,1fr);border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface);scroll-margin-top:16px}
.album.flash{outline:3px solid var(--accent);outline-offset:2px}
.a-side{background:var(--cor);color:var(--on-cor);display:flex;flex-direction:column;min-width:0}
.a-cap{padding:.7rem .6rem .3rem;text-align:center;font:700 1rem/1.25 var(--f-display);overflow-wrap:anywhere}
.a-sp{display:block;padding:0 .6rem .8rem;text-align:center;color:var(--on-cor);font:600 .78rem var(--f-body);text-decoration:underline;text-underline-offset:2px}
.tracks{display:flex;flex-direction:column;min-width:0;background:color-mix(in srgb,var(--cor) 12%,var(--surface))}
.t-head,.t-row{display:grid;grid-template-columns:minmax(0,1fr) 4rem 4.8rem;gap:.5rem;align-items:center;padding:.3rem .8rem}
.t-head{font:600 .68rem var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding-block:.5rem}
.t-head span:not(:first-child){text-align:center}
.t-row{border-bottom:1px solid color-mix(in srgb,var(--cor) 22%,var(--line))}
.t-name{display:flex;gap:.6rem;min-width:0;align-items:baseline}
.t-n{font:500 .8rem var(--f-mono);color:var(--muted);flex:none}
.t-t{min-width:0;overflow-wrap:anywhere;font-weight:500}
.sg{justify-self:center;width:1.45rem;height:1.45rem;border-radius:50%;border:2px solid var(--muted);background:transparent;cursor:pointer;padding:0}
.sg[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 4px var(--surface)}
.sg[disabled]{cursor:default}
.nota-in{width:100%;text-align:center;font:600 .95rem var(--f-mono);font-variant-numeric:tabular-nums;padding:.3rem .2rem;border:1px solid transparent;border-radius:8px;background:color-mix(in srgb,var(--ink) 7%,var(--surface));color:var(--ink)}
.nota-in::placeholder{color:var(--muted)}
.a-foot{display:flex;flex-wrap:wrap;gap:.5rem 1rem;justify-content:space-between;align-items:center;padding:.65rem .8rem}
.a-acts{display:flex;gap:.4rem;flex-wrap:wrap}
.a-nota{display:flex;align-items:baseline;gap:.6rem}
.a-nota small{font:600 .68rem var(--f-body);letter-spacing:.14em;color:var(--muted)}
.a-nota b{font:700 1.7rem var(--f-display);font-variant-numeric:tabular-nums}
.t-empty{padding:1rem .8rem;color:var(--muted)}

/* Estados */
.banner{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:.8rem 1rem;margin-bottom:18px;border:1px dashed var(--accent);border-radius:6px;background:var(--accent-soft)}
.banner p{margin:0;flex:1 1 280px}
.banner .acts{display:flex;gap:8px;flex-wrap:wrap}
.empty{padding:2.2rem 1.2rem;text-align:center;border:1px dashed var(--line);border-radius:6px;background:var(--surface)}
.empty h2{font-size:1.5rem;margin-bottom:.4rem}
.empty p{color:var(--muted);margin:0 auto 1rem;max-width:44ch}
.skel{height:92px;border-radius:6px;background:var(--surface);border:1px solid var(--line);margin-bottom:14px;opacity:.7}

/* Janela de cadastro */
.modal{position:fixed;inset:0;z-index:80;display:flex;justify-content:center;align-items:flex-start;overflow:auto;background:rgba(8,12,15,.6);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:min(100%,580px);margin:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:1.2rem}
.sheet h2{font-size:1.45rem;margin-bottom:1rem}
.fld{display:grid;gap:.3rem;margin-bottom:.9rem;min-width:0}
.fld label,.fld .lbl{font:600 .78rem var(--f-body);letter-spacing:.04em;color:var(--muted)}
.fld .in{background:var(--bg)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 6.5rem;gap:.75rem}
.cover-row{display:flex;gap:.9rem;align-items:flex-start;flex-wrap:wrap}
.cover-prev{width:96px;flex:none;border-radius:6px;overflow:hidden}
.cover-ctl{display:grid;gap:.5rem;min-width:0;flex:1 1 220px}
.cover-ctl input[type=file]{font-size:.85rem;max-width:100%}
.color-row{display:flex;align-items:center;gap:.5rem;font-size:.82rem;color:var(--muted)}
.color-row input{width:2.4rem;height:1.8rem;padding:0;border:1px solid var(--line);border-radius:4px;background:var(--bg)}
textarea.in{min-height:9rem;resize:vertical;line-height:1.5}
.hint{font-size:.8rem;color:var(--muted);margin:0}
.err{color:var(--danger);min-height:1.2rem;margin:0 0 .5rem;font-size:.88rem}
.form-acts{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:flex-end}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:.4rem 0 1rem}
.bar i{display:block;height:100%;background:var(--accent)}
.imp-sum{list-style:none;margin:0 0 1rem;padding:0;display:grid;gap:.45rem}
.imp-sum li{padding:.5rem .7rem;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.imp-sum details{margin-top:.3rem}
.imp-sum summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.85rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:90;max-width:min(92vw,420px);padding:.65rem 1rem;border-radius:8px;background:var(--ink);color:var(--bg);font-weight:600;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

.hctl2{display:grid;gap:8px;justify-items:end}
.hctl2 .hctl{justify-content:flex-end;flex-wrap:nowrap}
.hctl2 .sel{max-width:100%}
.a-acts.top{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem;width:100%}
.a-acts.top .btn{flex:1 1 auto;padding-inline:.6rem;min-width:0}
.form-top{position:sticky;top:calc(-1.2rem - 1px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);margin:-1.2rem -1.2rem 12px;padding:.8rem 1.2rem;border-bottom:1px solid var(--line);border-radius:10px 10px 0 0}
.form-top h2{margin:0;font-size:1.15rem}
.ft-acts{display:flex;gap:.4rem}
.hctl{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
body.sq .avatar{border-radius:10px}
.fixnote{margin:0;padding:.5rem .8rem;background:color-mix(in srgb,var(--warn) 16%,var(--surface));font-size:.82rem;border-bottom:1px solid var(--line)}
.month{margin:22px 0 8px;font:700 .8rem var(--f-body);letter-spacing:.14em;color:var(--muted)}
.month span{font:500 .75rem var(--f-mono);letter-spacing:0;margin-left:.4rem}
.lrow{display:grid;grid-template-columns:1.6rem 3rem minmax(0,1fr) auto;gap:.3rem .7rem;align-items:center;padding:.55rem .8rem;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow.orow{grid-template-columns:1.6rem minmax(0,1fr) auto}
.lrow.nochk{grid-template-columns:3rem minmax(0,1fr) auto}
.lrow.done{background:color-mix(in srgb,var(--ok) 13%,var(--surface))}
.ld{font:500 .85rem var(--f-mono);color:var(--muted)}
.lt{min-width:0;overflow-wrap:anywhere}
.lt small{font:500 .72rem var(--f-mono);color:var(--muted);margin-left:.3rem}
.lact{display:flex;gap:.35rem;flex-wrap:wrap;justify-content:flex-end}
.chk{width:1.5rem;height:1.5rem;border-radius:5px;border:2px solid var(--muted);background:transparent;cursor:pointer;padding:0;position:relative}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.chk[aria-pressed="true"]::after{content:"";position:absolute;left:.42rem;top:.1rem;width:.35rem;height:.72rem;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.chk[disabled]{cursor:default}
.addrow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.5fr) 6rem auto;gap:.5rem;margin-bottom:8px}
.donuts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin-bottom:22px}
.dcard{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:1rem;display:grid;gap:.7rem;min-width:0;align-content:start}
.dcard h3{font-size:1.05rem}
.dsvg{width:min(100%,200px);margin:0 auto;display:block}
.arc{cursor:pointer;transition:opacity .15s}
.arc:hover{opacity:.8}
.dn{fill:var(--ink);font:700 34px var(--f-display);text-anchor:middle}
.dl{fill:var(--muted);font:500 11px var(--f-mono);text-anchor:middle}
.leg{display:grid;gap:.35rem}
.leg button{display:flex;align-items:center;gap:.5rem;width:100%;padding:.45rem .55rem;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink);font:inherit;font-size:.88rem;cursor:pointer;text-align:left}
.leg button.on,.leg button:hover{border-color:var(--accent);background:var(--accent-soft)}
.leg i{width:.8rem;height:.8rem;border-radius:3px;flex:none}
.leg b{margin-left:auto;font:500 .95rem var(--f-mono)}
.sellist{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:1rem;scroll-margin-top:12px}
.sellist h3{font-size:1.1rem;margin-bottom:.6rem}
.sellist ul{list-style:none;margin:0;padding:0;display:grid;gap:.1rem}
.sellist li{display:flex;gap:.6rem;align-items:baseline;padding:.2rem 0;min-width:0}
.sellist small{font:500 .72rem var(--f-mono);color:var(--muted)}
.pill{border:0;background:transparent;padding:0;color:var(--accent);font:600 .92rem var(--f-body);text-align:left;cursor:pointer;text-decoration:underline;text-underline-offset:2px;overflow-wrap:anywhere}
.pill.off{color:var(--ink);text-decoration:none;cursor:default;font-weight:500}
.pod{display:grid;gap:12px;margin-bottom:22px}
.pod button{border:0;font:inherit;text-align:left;cursor:pointer;width:100%;color:var(--p-ink)}
.pod button:hover{filter:brightness(.97)}
.pod .top1{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr);gap:16px;align-items:center;padding:14px;border-radius:10px;background:var(--p1)}
.pod .top1 .cover{border-radius:8px}
.pod .lab{font:700 .72rem var(--f-mono);letter-spacing:.14em;text-transform:uppercase}
.pod .top1 h3{font-size:clamp(1.3rem,4.5vw,1.9rem);letter-spacing:-.015em;line-height:1.1;margin:.2rem 0 .1rem;overflow-wrap:anywhere}
.pod .ar{font-weight:500;overflow-wrap:anywhere}

function setupScreen(){return new Promise(function(res){
  var o=ui(LG+'<p style="margin:0;color:#92a1ab">Configuração, só uma vez. Cole os dois dados do seu projeto no Supabase (Project Settings, API).</p><input id="pf-url" '+IN+' placeholder="Project URL (https://....supabase.co)" autocapitalize="off" autocorrect="off" inputmode="url"><input id="pf-key" '+IN+' placeholder="Chave pública (anon ou publishable)" autocapitalize="off" autocorrect="off"><p id="pf-err" style="margin:0;color:#ff8a80;min-height:1.2em" role="alert"></p><button id="pf-go" type="button" '+BT+'>Continuar</button>');
  o.querySelector('#pf-go').onclick=function(){var u=o.querySelector('#pf-url').value.trim().replace(/\/+$/,''),k=o.querySelector('#pf-key').value.trim();
    if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(u)){o.querySelector('#pf-err').textContent='A URL deve parecer https://abcd.supabase.co';return}

function loginScreen(c){return new Promise(function(res){
  var o=ui(LG+'<p style="margin:0;color:#92a1ab">Entre com o e-mail e a senha que você criou no Supabase.</p><input id="pf-em" '+IN+' type="email" placeholder="E-mail" autocomplete="username" autocapitalize="off"><input id="pf-pw" '+IN+' type="password" placeholder="Senha" autocomplete="current-password"><p id="pf-err" style="margin:0;color:#ff8a80;min-height:1.2em" role="alert"></p><button id="pf-go" type="button" '+BT+'>Entrar</button><button id="pf-rs" type="button" style="background:none;border:0;color:#92a1ab;font:inherit;cursor:pointer">Trocar o projeto</button>');
  var go=async function(){var em=o.querySelector('#pf-em').value.trim(),pw=o.querySelector('#pf-pw').value;if(!em||!pw){o.querySelector('#pf-err').textContent='Preencha e-mail e senha.';return}
    o.querySelector('#pf-go').disabled=true;o.querySelector('#pf-go').textContent='Entrando…';
    var r=await client.auth.signInWithPassword({email:em,password:pw});
    if(r.error){o.querySelector('#pf-go').disabled=false;o.querySelector('#pf-go').textContent='Entrar';o.querySelector('#pf-err').textContent=/invalid/i.test(r.error.message||'')?'E-mail ou senha incorretos.':'Não consegui entrar: '+(r.error.message||'erro');return}
    res()};
  o.querySelector('#pf-go').onclick=go;o.querySelector('#pf-pw').addEventListener('keydown',function(e){if(e.key==='Enter')go()});
  o.querySelector('#pf-rs').onclick=function(){try{localStorage.removeItem(CFGK)}catch(e){}location.reload()}})}
async function getClient(){
  if(client)return client;
  if(clientP)return clientP;
  clientP=(async function(){
    if(!window.supabase||!window.supabase.createClient)throw new Error('sem biblioteca');
    var c=cfg();if(!c||!c.url||!c.key)c=await setupScreen();
    client=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
    var s=await client.auth.getSession();
    if(!s||!s.data||!s.data.session)await loginScreen(c);
    hide();return client})();
  try{return await clientP}catch(e){clientP=null;client=null;throw e}}
var cols={};
function makeCol(name){
  if(cols[name])return cols[name];
  var cache=new Map(),subs=[],loaded=false,last=0;
  function emit(){var docs=[];cache.forEach(function(v,id){docs.push({id:id,data:function(){return v.d}})});subs.forEach(function(s){try{s.cb({docs:docs})}catch(e){}})}
  async function fetchAll(){
    var rows=[],from=0,r,i;
    for(;;){r=await client.from('docs').select('id,updated_at').eq('coll',name).order('id').range(from,from+999);if(r.error)throw r.error;rows=rows.concat(r.data);if(r.data.length<1000)break;from+=1000}
    var ids=new Set(rows.map(function(x){return x.id})),changed=false;
    cache.forEach(function(v,k){if(!ids.has(k)){cache.delete(k);changed=true}});
    var want=rows.filter(function(x){var c=cache.get(x.id);return !c||c.ts!==x.updated_at}).map(function(x){return x.id});
    for(i=0;i<want.length;i+=30){var ch=want.slice(i,i+30);var d=await client.from('docs').select('id,data,updated_at').eq('coll',name).in('id',ch);if(d.error)throw d.error;d.data.forEach(function(x){cache.set(x.id,{d:x.data,ts:x.updated_at});changed=true})}
    last=Date.now();return changed}
  var col={
    doc:function(id){return {
      set:async function(data){var r=await client.from('docs').upsert({coll:name,id:id,data:data},{onConflict:'coll,id'}).select('updated_at');if(r.error)throw r.error;cache.set(id,{d:data,ts:r.data&&r.data[0]?r.data[0].updated_at:null});emit()},
      delete:async function(){var r=await client.from('docs').delete().eq('coll',name).eq('id',id);if(r.error)throw r.error;cache.delete(id);emit()}}},
    onSnapshot:function(cb,err){subs.push({cb:cb,err:err});
      if(loaded){emit();return function(){}}
      fetchAll().then(function(){loaded=true;emit()}).catch(function(e){if(err)err(e)});return function(){}},
    refresh:async function(){if(!loaded||Date.now()-last<30000)return;try{if(await fetchAll())emit()}catch(e){}}};
  cols[name]=col;return col}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')Object.keys(cols).forEach(function(k){cols[k].refresh()})});
function dl(opts){var data=opts.data,name=opts.filename,blob=(data instanceof Blob)?data:new Blob([data],{type:/\.json$/i.test(name)?'application/json':'text/plain'});
  var file=null;try{file=new File([blob],name,{type:blob.type})}catch(e){}
  if(file&&/image\//.test(blob.type)&&navigator.canShare&&navigator.canShare({files:[file]})){return navigator.share({files:[file]}).catch(function(e){if(e&&e.name==='AbortError')throw {code:'declined'};throw e})}
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},4000);return Promise.resolve()}
window.claude={use:async function(n){
  if(n==='db'){await getClient();return {collection:makeCol}}
  if(n==='user')return {id:async function(){return null},canEdit:async function(){return true}};
  if(n==='downloads')return {save:dl};
  return null}};
function extras(){
  var m=document.getElementById('menu');if(!m)return;
  var pl=m.querySelector('[data-act="planilha"]');if(pl)pl.remove();
  var b=document.createElement('button');b.type='button';b.textContent='Sair da conta';b.addEventListener('click',async function(){try{if(client)await client.auth.signOut()}catch(e){}location.reload()});m.appendChild(b)}
extras();
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})});
})();

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var norm=function(s){return String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim()};
var clone=function(o){return JSON.parse(JSON.stringify(o))};
var fmt2=function(n){return n==null?'—':n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})};
var fmt1=function(n){return n==null?'':n.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:2})};
var LS='minha-discoteca:v1',LSF='minha-discoteca:fotos';
var SP=/^https:\/\/open\.spotify\.com\/[A-Za-z0-9\/_-]+$/;

/* ---------- cores ---------- */
function hashStr(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function hslHex(h,s,l){h=((h%360)+360)%360;s/=100;l/=100;var k=function(n){return (n+h/30)%12},a=s*Math.min(l,1-l);
  var f=function(n){var v=l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return Math.round(255*v).toString(16).padStart(2,'0')};
  return '#'+f(0)+f(8)+f(4)}
function hashColor(s){return hslHex(hashStr(s||'x')%360,42,36)}
function lum(hex){var r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  var c=function(v){return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*c(r)+.7152*c(g)+.0722*c(b)}
function onColor(hex){return lum(hex)>.32?'#121212':'#FFFFFF'}
var akey=function(k){return 'k'+hashStr(k).toString(36)};

/* ---------- dados ---------- */
var DEMO=[
 {id:'demo1',titulo:'Growth',artista:'Olivia Dean',ano:2021,capa:'',cor:'#7C8A6A',spotify:'',criado:1,faixas:[
  ['Be My Own Boyfriend',8.5],['Slowly',8],['Cross My Mind',8.5],['Fall Again',8],['Float',8.5]].map(function(x){return {n:x[0],s:false,v:x[1]}})},
 {id:'demo2',titulo:'Messy',artista:'Olivia Dean',ano:2023,capa:'',cor:'#9A5593',spotify:'',criado:2,faixas:[
  ['UFO',8.5],['Dive',10],['Ladies Room',8.5],['No Man',8],['Dangerously Easy',8.5],['Getting There - Interlude',8],['Danger',9],['The Hardest Part',9.5],['I Could Be A Florist',8],['Messy',8],["Everybody's Crazy",8.5],['Carmen',8.5]].map(function(x){return {n:x[0],s:false,v:x[1]}})}
];
var state={vt:false,albView:'capas',mInfo:'',albums:[],fotos:{},loading:true,mode:'local',canEdit:true,demo:false,view:{t:'artistas'},q:'',sort:'nota',albSort:'nota',lanc:[],ouvir:[],lyear:0,lEdit:false,cols:3,cforma:'sq',aEdit:false,aView:'capas',aSel:'',shSel:'',menu:false,recN:40,more:false,podFull:false,estF:'',oTab:'lista',oyear:0,sel:null,forma:'round',focusId:null,dismissed:false,confirmDel:null};
var col=null,fcol=null,refocus=null,queues=new Map(),lastFocus=null;

function normAlbum(r,id){
  r=r||{};var f=Array.isArray(r.faixas)?r.faixas:[];
  var titulo=String(r.titulo||'').slice(0,200),artista=String(r.artista||'').slice(0,200);
  return {id:id,titulo:titulo,artista:artista,
    ano:(typeof r.ano==='number'&&isFinite(r.ano))?Math.round(r.ano):null,
    capa:(typeof r.capa==='string'&&r.capa.indexOf('data:image/')===0)?r.capa:'',
    cor:/^#[0-9a-f]{6}$/i.test(r.cor||'')?r.cor:hashColor(titulo+artista),
    estilo:String(r.estilo||'').trim().slice(0,60),spotify:(typeof r.spotify==='string'&&SP.test(r.spotify))?r.spotify:'',src:(typeof r.src==='string')?r.src.slice(0,160):'',
    faixas:f.slice(0,200).map(function(x){x=x||{};return {n:String(x.n||'').slice(0,200),s:!!x.s||(typeof x.sn==='number'&&x.sn>=1),sn:(typeof x.sn==='number'&&isFinite(x.sn)&&x.sn>=1)?Math.min(99,Math.round(x.sn)):null,x:!!x.x,v:(typeof x.v==='number'&&isFinite(x.v))?Math.min(10,Math.max(0,x.v)):null}}),
    critica:String(r.critica||'').trim().slice(0,140),ouvidoEm:/^\d{4}-\d{2}$/.test(r.ouvidoEm||'')?r.ouvidoEm:'',abandono:r.abandono==='abandonou'?'abandonou':'',notaEm:Number(r.notaEm)||0,
    criado:Number(r.criado)||0};
}
var all=function(){return state.demo?DEMO:state.albums};
var isRO=function(){return state.demo||!state.canEdit};
var find=function(id){return all().find(function(a){return a.id===id})};
function nota(a){var v=a.faixas.map(function(f){return f.v}).filter(function(v){return typeof v==='number'});
  return v.length?v.reduce(function(x,y){return x+y},0)/v.length:null}
function mean(arr){var n=arr.filter(function(x){return x!=null});return n.length?n.reduce(function(x,y){return x+y},0)/n.length:null}
function byNota(a,b){var x=nota(a),y=nota(b);
  if(x==null&&y==null)return a.titulo.localeCompare(b.titulo,'pt-BR');
  if(x==null)return 1; if(y==null)return -1;
  return (y-x)||a.titulo.localeCompare(b.titulo,'pt-BR')}
function artistsOf(list){var m=new Map();
  list.forEach(function(a){var k=norm(a.artista);if(!m.has(k))m.set(k,{k:k,nome:a.artista.trim(),n:0,notas:[]});var e=m.get(k);e.n++;e.notas.push(complete(a)?nota(a):null)});
  return Array.from(m.values()).map(function(e){e.avg=mean(e.notas);return e}).sort(function(x,y){return x.nome.localeCompare(y.nome,'pt-BR')})}
var newId=function(){return 'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)};
function parseNota(raw){raw=String(raw).trim().replace(',','.');if(raw==='')return null;
  var n=Number(raw);if(!isFinite(n))return undefined;return Math.round(Math.min(10,Math.max(0,n))*100)/100}

/* ---------- salvar ---------- */
function loadLocal(){try{var r=JSON.parse(localStorage.getItem(LS)||'[]');return Array.isArray(r)?r.map(function(x){return normAlbum(x,(x&&x.id)||newId())}):[]}catch(e){return []}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(state.albums))}catch(e){}}
function loadFotosLocal(){try{var r=JSON.parse(localStorage.getItem(LSF)||'{}');return r&&typeof r==='object'?r:{}}catch(e){return {}}}
function saveFotosLocal(){try{localStorage.setItem(LSF,JSON.stringify(state.fotos))}catch(e){}}
function enqueue(id,fn){var prev=queues.get(id)||Promise.resolve();var p=prev.catch(function(){}).then(fn);queues.set(id,p);return p}
function upsert(a){var i=state.albums.findIndex(function(x){return x.id===a.id});if(i>=0)state.albums[i]=a;else state.albums.push(a)}
function fail(e){toast(e&&e.code==='invalid_argument'?'Você não tem permissão para salvar aqui.':'Não foi possível salvar. Tente de novo.')}
async function persist(a){
  upsert(a);
  if(state.mode==='cloud'){var d=clone(a);delete d.id;try{await enqueue(a.id,function(){return col.doc(a.id).set(d)})}catch(e){fail(e)}}
  else saveLocal();
}
async function removeAlbum(id){
  state.albums=state.albums.filter(function(a){return a.id!==id});
  if(state.mode==='cloud'){try{await enqueue(id,function(){return col.doc(id).delete()})}catch(e){fail(e)}}
  else saveLocal();
}
async function saveFoto(k,foto){
  if(foto)state.fotos[k]=foto;else delete state.fotos[k];
  if(state.mode==='cloud'){
    try{await enqueue('f'+k,function(){return foto?fcol.doc(akey(k)).set({k:k,foto:foto}):fcol.doc(akey(k)).delete()})}catch(e){fail(e)}}
  else saveFotosLocal();
}

/* ---------- HTML ---------- */
function initials(t){var w=String(t).trim().split(/\s+/).filter(Boolean);return ((w[0]||'?')[0]+(w[1]?w[1][0]:'')).toUpperCase()}
function coverHTML(a,cls){
  var cc=corOf(a),st='--cor:'+cc+';--on-cor:'+onColor(cc);
  if(a.capa)return '<img class="cover '+cls+'" src="'+esc(a.capa)+'" alt="Capa de '+esc(a.titulo)+'" style="'+st+'">';
  return '<div class="cover ph '+cls+'" style="'+st+'" aria-hidden="true"><span>'+esc(initials(a.titulo))+'</span></div>'}
function avatarHTML(nome,k,list){
  var foto=state.fotos[k];
  if(!foto){var mine=list.filter(function(a){return norm(a.artista)===k&&a.capa}).sort(function(a,b){return (b.ano||0)-(a.ano||0)||b.criado-a.criado});foto=mine[0]&&mine[0].capa}
  if(foto)return '<img class="avatar" src="'+esc(foto)+'" alt="Foto de '+esc(nome)+'">';
  var cor=hashColor(nome);
  return '<div class="avatar ph" style="--cor:'+cor+';--on-cor:'+onColor(cor)+'" aria-hidden="true"><span>'+esc(initials(nome))+'</span></div>'}
function podTop(list){return list.filter(complete).sort(byNota).slice(0,3)}

  if(compact)return '<section class="pod compact" aria-label="Pódio de álbuns">'+top.map(function(a,i){
    return '<button type="button" class="pc p'+(i+1)+'" data-act="open" data-id="'+esc(a.id)+'">'+coverHTML(a,'')+'<span class="pt"><span class="lab">'+(i+1)+'º</span><b>'+esc(a.titulo)+'</b></span><span class="nt">'+fmt2(nota(a))+'</span></button>'}).join('')+'</section>';
  var one=top[0];
  var h='<section class="pod" aria-label="Pódio de álbuns"><button type="button" class="top1" data-act="open" data-id="'+esc(one.id)+'">'+coverHTML(one,'')+
    '<div class="pt"><div class="lab">1º lugar</div><h3>'+esc(one.titulo)+'</h3><div class="ar">'+sub(one)+'</div><div class="big">'+fmt2(nota(one))+'</div></div></button>';
  if(top.length>1)h+='<div class="duo">'+top.slice(1).map(function(a,i){
    return '<button type="button" class="mini m'+(i+2)+'" data-act="open" data-id="'+esc(a.id)+'">'+coverHTML(a,'')+'<div class="pt"><div class="lab">'+(i+2)+'º lugar</div><b>'+esc(a.titulo)+'</b><div class="ar">'+sub(a)+'</div><div class="nt">'+fmt2(nota(a))+'</div></div></button>'}).join('')+'</div>';
  return h+'</section>'}
function rankHTML(list,skip){
  skip=skip||0;var l=list.slice().sort(byNota).slice(skip);
  if(!list.length)return '<div class="ranking"><p class="none">Nenhum álbum encontrado.</p></div>';
  if(!l.length)return '';
  return '<div class="ranking">'+l.map(function(a,i){
    return '<button type="button" class="row" data-act="open" data-id="'+esc(a.id)+'"><span class="pos">'+(i+1+skip)+'</span>'+coverHTML(a,'thumb')+
    '<span class="tx"><b>'+esc(a.titulo)+'</b><span>'+esc(a.artista)+(a.ano?' · '+a.ano:'')+(a.estilo?' · '+esc(a.estilo):'')+'</span></span><span class="nt">'+fmt2(nota(a))+'</span></button>'}).join('')+'</div>'}
var BASE_EST=['Pop','Dance-pop','R&B','Hip-hop','Rock','Indie','Alternativo','Eletrônica','Country','Folk','Soul','Latino','K-pop','Funk','Jazz','MPB'];

async function capasLote(files){
  var ok=0,miss=[],list=state.albums.slice(),i;
  for(i=0;i<files.length;i++){var fl=files[i];if(String(fl.type).indexOf('image/')!==0)continue;
    var stem=fl.name.replace(/\.[^.]+$/,''),parts=stem.split(/\s+[-–—]\s+|__|_-_/),ks=tkey(stem),hit=null;
    if(parts.length>=2){var ka=tkey(parts[0]),kt=tkey(parts.slice(1).join(' '));hit=list.find(function(a){return tkey(a.artista)===ka&&tkey(a.titulo)===kt})}
    if(!hit){var c=list.filter(function(a){var x=tkey(a.titulo),y=tkey(a.artista);return x&&y&&ks.indexOf(x)>=0&&ks.indexOf(y)>=0});if(c.length===1)hit=c[0]}

function normItem(k,r,id){
  r=r||{};
  var o={id:id,titulo:String(r.titulo||'').slice(0,200),artista:String(r.artista||'').slice(0,200),ouvido:!!r.ouvido,criado:Number(r.criado)||0};

  else{o.anoOuv=(+r.anoOuv>=1900&&+r.anoOuv<=2100)?Math.round(+r.anoOuv):null;o.ano=(typeof r.ano==='number'&&isFinite(r.ano))?Math.round(r.ano):null;o.data=/^\d{4}-\d{2}-\d{2}$/.test(r.data||'')?r.data:''}
  return o}

  if(state.mode==='cloud'&&lcols[k]){var d=clone(it);delete d.id;try{await enqueue(k+it.id,function(){return lcols[k].doc(it.id).set(d)})}catch(e){fail(e)}}

  else saveLocalList(k)}
function tkey(s){return norm(s).replace(/[^a-z0-9]+/g,'')}
function matchCat(artista,titulo){var ka=tkey(artista),kt=tkey(titulo);if(!ka||!kt)return null;
  return all().find(function(a){return tkey(a.artista)===ka&&tkey(a.titulo)===kt})||null}
function heardCat(it){var a=matchCat(it.artista,it.titulo);return a&&nota(a)!=null?a:null}

function ymd(d){return d.slice(8,10)+'.'+d.slice(5,7)}
function needsFix(a){return /^Álbum sem título/.test(a.titulo)||a.faixas.some(function(f){return /^Faixa \d+$/.test(f.n)})}

function sortAlbums(list,mode){
  var l=list.slice(),tt=function(a,b){return a.titulo.localeCompare(b.titulo,'pt-BR')};
  if(mode==='menor')l.sort(function(a,b){var x=nota(a),y=nota(b);if(x==null&&y==null)return tt(a,b);if(x==null)return 1;if(y==null)return -1;return (x-y)||tt(a,b)});
  else if(mode==='ano')l.sort(function(a,b){return ((b.ano||0)-(a.ano||0))||byNota(a,b)});
  else if(mode==='az')l.sort(tt);
  else if(mode==='artista')l.sort(function(a,b){return a.artista.localeCompare(b.artista,'pt-BR')||((a.ano||9999)-(b.ano||9999))||tt(a,b)});
  else if(mode==='ano-asc')l.sort(function(a,b){return ((a.ano||9999)-(b.ano||9999))||byNota(a,b)});
  else if(mode==='recentes')l.sort(function(a,b){return ((b.notaEm||0)-(a.notaEm||0))||(b.criado-a.criado)||tt(a,b)});
  else l.sort(byNota);
  return l}

function sStr(x){return x==null?'':String(x).trim()}

/* Aba de artista: colunas A (título e ano, na linha NOTA), B (faixa), C (single), D (nota). */
function parseArtistTab(rows,artist){
  var out=[],cur=[],un=0;
  rows.forEach(function(r){
    r=r||[];var a=sStr(r[0]),b=sStr(r[1]),c=sStr(r[2]);
    if(norm(b)==='nota'){
      var m=a.match(/^(.*?)\s*\((\d{4})\)\s*$/),titulo=m?m[1].trim():a;
      if(titulo)out.push({artista:artist,titulo:titulo,ano:m?+m[2]:null,faixas:cur});
      else if(cur.length){un++;out.push({artista:artist,titulo:'Álbum sem título '+un,ano:null,faixas:cur,src:artist+'#'+un})}
      cur=[];return}
    if(b&&!/^(single|notas?)$/i.test(b)){var mn=c.match(/(\d+)/);cur.push({n:cleanTrack(b),s:!!c,sn:mn?+mn[1]:null,v:pNota(r[3])})}
  });

/* Abas DO ANO e GERAL: blocos de 4 colunas (número, faixa, nota, vazio); cada álbum começa numa linha "Artista - Álbum". */
function parseGridTab(rows,ano){
  var out=[],warn=[],w=0;
  rows.forEach(function(r){if(r&&r.length>w)w=r.length});
  var groups=Math.ceil(w/4);
  for(var g=0;g<groups;g++){
    var cn=4*g,cm=cn+1,ct=cn+2,cur=null,lastArtist='';
    for(var i=1;i<rows.length;i++){
      var r=rows[i]||[],num=sStr(r[cn]),nm=sStr(r[cm]),nt=sStr(r[ct]);
      if(nm){if(cur)cur.faixas.push({n:cleanTrack(nm),s:false,v:pNota(nt)});continue}
      if(cur&&/^\d+$/.test(num)&&nt){cur.faixas.push({n:'Faixa '+num,s:false,v:pNota(nt)});continue}
      if(num&&!/^\d+$/.test(num)&&!nt){
        var k=num.indexOf(' - '),artist,title;
        if(k>0){artist=num.slice(0,k).trim();title=num.slice(k+3).trim();lastArtist=artist}
        else{artist=lastArtist;title=num}
        if(!artist||!title){warn.push('Cabeçalho sem artista: '+num);cur=null;continue}
        cur={artista:artist,titulo:title,ano:ano,faixas:[]};out.push(cur)}
    }
  }
  return {albums:out,warnings:warn}}
/* Aba de artista no formato novo: linha 1 com o título de cada álbum (a cada 3 colunas a partir da D); abaixo, número, faixa e nota. */
function parseBannerTab(rows,artist){
  var out=[],hdr=rows[0]||[],w=0;
  rows.forEach(function(r){if(r&&r.length>w)w=r.length});
  for(var c=3;c<w;c+=3){
    var title=sStr(hdr[c]);if(!title||title.charAt(0)==='#')continue;
    var faixas=[];
    for(var i=1;i<rows.length;i++){
      var r=rows[i]||[],nm=sStr(r[c+1]);
      if(/^os melhores/i.test(sStr(r[0])))break;
      if(nm&&nm.charAt(0)!=='#')faixas.push({n:cleanTrack(nm),s:false,v:pNota(r[c+2])})}

function albumKey(a){return norm(a.artista)+'|'+norm(a.titulo)}
function rated(a){return a.faixas.filter(function(f){return f.v!=null}).length}
/* Junta as abas na ordem: artistas primeiro, depois DO ANO e GERAL. Repetidos ficam com a versão que tem mais notas. */
function mergeAlbums(parts,tabArtists){
  var canon=new Map();tabArtists.forEach(function(n){canon.set(norm(n),n)});

    else if(!old.ano&&a.ano)old.ano=a.ano});
  return order.map(function(k){return map.get(k)})}

  return 'Não consegui ler agora ('+esc(c||'erro')+'). Tente de novo em instantes.'}
function openImport(){
  if(!state.canEdit){toast('Você só pode ver este catálogo.');return}
  lastFocus=document.activeElement;state.imp={busy:false,cancel:false,res:null};
  $('#modal-root').innerHTML='<div class="modal"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="it"><h2 id="it">Importar da planilha do Google</h2>'+
   '<div class="fld"><label for="imp-links">Links das planilhas (um por linha)</label><textarea class="in" id="imp-links" rows="5" spellcheck="false" style="min-height:6rem">'+esc(IMP_LINKS.join('\n'))+'</textarea>'+
   '<p class="hint">Cada aba com nome de artista vira um artista. As abas “1. DO ANO” (álbuns de 2026) e “2. GERAL” viram álbuns, e os artistas que ainda não têm página são criados. Álbuns que já estão aqui (mesmo título, ou as mesmas primeiras faixas) não são alterados nem repetidos.</p></div>'+
   '<div id="imp-out" aria-live="polite"></div>'+
   '<div class="form-acts"><button class="btn" type="button" data-act="fechar">Fechar</button><button class="btn primary" type="button" data-act="imp-read" id="imp-read">Ler planilhas</button></div></div></div>'}
async function readSheets(){
  var im=state.imp;if(!im||im.busy)return;
  var ids=Array.from(new Set($('#imp-links').value.split(/\s+/).filter(Boolean).map(sheetIdOf).filter(Boolean)));
  if(!ids.length){impOut('<p class="err">Cole pelo menos um link de planilha.</p>');return}
  var mcp=null;try{mcp=window.claude&&window.claude.use?await window.claude.use('mcp'):null}catch(e){}
  if(!mcp){impOut('<p class="err">Esta janela não consegue falar com o Google Sheets. Abra o catálogo pelo claude.ai.</p>');return}
  im.busy=true;im.res=null;$('#imp-read').disabled=true;
  var idKey='spreadsheetId';
  try{var ds=await mcp.describeTool(SHEETS_SERVER,'get_values');var pr=ds&&ds.inputSchema&&ds.inputSchema.properties;if(pr&&!pr.spreadsheetId&&pr.spreadsheet_id)idKey='spreadsheet_id'}catch(e){}
  var call=async function(tool,input){input=clone(input);if(idKey!=='spreadsheetId'){input[idKey]=input.spreadsheetId;delete input.spreadsheetId}var r=await mcp.callTool(SHEETS_SERVER,tool,input);return impPayload(r)};
  var tabs=[],warns=[],failed=[];
  try{
    for(var s=0;s<ids.length;s++){
      impOut('<p>Abrindo planilha '+(s+1)+' de '+ids.length+'…</p>');
      var meta=await call('get_spreadsheet',{spreadsheetId:ids[s],fields:['properties.title','sheets.properties.title','sheets.properties.gridProperties']});
      ((meta&&meta.sheets)||[]).forEach(function(sh){var p=sh.properties||{},g=p.gridProperties||{};
        tabs.push({id:ids[s],title:p.title||'',rows:Math.min(g.rowCount||1000,1500),cols:Math.min(g.columnCount||8,60)})})}
  }catch(e){impOut('<p class="err">'+impErr(e)+'</p>');im.busy=false;$('#imp-read').disabled=false;return}
  var banner={};
  for(var bi=0;bi<ids.length;bi++){
    var t0=tabs.find(function(t){return t.id===ids[bi]&&!/^\s*[12]\./.test(t.title)});
    if(!t0)continue;
    try{var pb=await call('get_values',{spreadsheetId:ids[bi],range:"'"+t0.title.replace(/'/g,"''")+"'!A1:A1"});banner[ids[bi]]=/^as melhores/i.test(sStr(((pb&&pb.values)||[[]])[0]&&pb.values[0][0]))}catch(e){}}
  var kind=function(t){return /^\s*1\./.test(t)?'ano':/^\s*2\./.test(t)?'geral':'artista'};
  var results=new Array(tabs.length),done=0,next=0,fatal=null;
  var worker=async function(){
    while(!fatal&&!im.cancel){
      var i=next++;if(i>=tabs.length)return;var t=tabs[i],k=kind(t.title);
      var bn=k==='artista'&&banner[t.id];
      var last=k==='artista'?(bn?colLetter(t.cols):'D'):colLetter(t.cols);
      var range="'"+t.title.replace(/'/g,"''")+"'!A1:"+last+(bn?Math.min(t.rows,80):t.rows);
      try{
        var p=await call('get_values',{spreadsheetId:t.id,range:range});
        var rows=(p&&p.values)||[];
        results[i]=k==='artista'?(bn?parseBannerTab(rows,t.title):parseArtistTab(rows,t.title)):parseGridTab(rows,k==='ano'?2026:null);
      }catch(e){
        if(e&&(e.code==='needs_reauth'||e.code==='server_not_connected'||e.code==='not_in_manifest'||e.code==='approval_required'||e.code==='selection_required'))fatal=e;
        else failed.push(t.title)}
      done++;
      impOut('<p>Lendo abas: '+done+' de '+tabs.length+' ('+esc(t.title)+')</p><div class="bar"><i style="width:'+Math.round(done/tabs.length*100)+'%"></i></div>')}};
  await Promise.all([worker(),worker(),worker()]);
  im.busy=false;$('#imp-read').disabled=false;
  if(fatal){impOut('<p class="err">'+impErr(fatal)+'</p>');return}
  if(im.cancel)return;
  var parts=[],tabArtists=[];
  ['artista','ano','geral'].forEach(function(kk){tabs.forEach(function(t,i){
    if(kind(t.title)!==kk||!results[i])return;
    if(kk==='artista')tabArtists.push(t.title);
    results[i].albums.forEach(function(a){parts.push(a)});results[i].warnings.forEach(function(w){warns.push(w)})})});
  var merged=mergeAlbums(parts,tabArtists);
  var have=new Set(state.albums.map(albumKey));
  var haveSrc=new Set(state.albums.map(function(a){return a.src}).filter(Boolean));
  var fpOf=function(a){var t=a.faixas.slice(0,4).map(function(f){return tkey(f.n)});return t.length>=3?t.join('|'):''};
  var haveFp=new Set(state.albums.map(fpOf).filter(Boolean));
  var fresh=merged.filter(function(a){return !have.has(albumKey(a))&&!(a.src&&haveSrc.has(a.src))&&!(fpOf(a)&&haveFp.has(fpOf(a)))});
  var artsNew=new Set(fresh.map(function(a){return norm(a.artista)}).filter(function(k){return !state.albums.some(function(x){return norm(x.artista)===k})}));
  var snUpd=[];
  merged.forEach(function(a){
    if(!a.faixas.some(function(f){return f.sn}))return;
    var ex=state.albums.find(function(x){return albumKey(x)===albumKey(a)})||state.albums.find(function(x){return fpOf(x)&&fpOf(x)===fpOf(a)});
    if(!ex)return;
    var map=new Map();a.faixas.forEach(function(f){if(f.sn)map.set(tkey(f.n),f.sn)});
    var c=clone(ex),ch=0;
    c.faixas.forEach(function(f){var n=map.get(tkey(f.n));if(n&&f.sn!==n){f.sn=n;f.s=true;ch++}});
    if(ch)snUpd.push(c)});
  im.res={fresh:fresh,snUpd:snUpd,total:merged.length,existing:merged.length-fresh.length};
  var semFaixas=fresh.filter(function(a){return !a.faixas.length}),semNotas=fresh.filter(function(a){return a.faixas.length&&!rated(a)});
  var li=function(arr){return arr.length?'<details><summary>Ver lista</summary><p class="hint">'+arr.slice(0,80).map(function(a){return esc(a.artista+' - '+a.titulo)}).join('<br>')+(arr.length>80?'<br>…':'')+'</p></details>':''};
  impOut('<ul class="imp-sum"><li><b>'+tabs.length+'</b> abas lidas</li><li><b>'+merged.length+'</b> álbuns encontrados, <b>'+fresh.length+'</b> novos'+(im.res.existing?' ('+im.res.existing+' já estavam aqui)':'')+'</li>'+
    '<li><b>'+artsNew.size+'</b> artistas novos</li>'+
    '<li><b>'+fresh.filter(needsFix).length+'</b> álbuns precisam de título ou nomes de faixa (a planilha não traz esses textos)</li>'+
    '<li><b>'+semFaixas.length+'</b> álbuns sem lista de faixas'+li(semFaixas)+'</li>'+
    '<li><b>'+semNotas.length+'</b> álbuns com faixas mas sem nenhuma nota'+li(semNotas)+'</li>'+
    (failed.length?'<li class="err">Abas que não consegui ler: '+esc(failed.join(', '))+'</li>':'')+
    (warns.length?'<li>Avisos: '+esc(warns.slice(0,5).join('; '))+'</li>':'')+
    (snUpd.length?'<li><b>'+snUpd.length+'</b> álbuns já cadastrados ganham a ordem dos singles (1º, 2º…) da planilha</li>':'')+
    '</ul>'+'<div class="form-acts">'+(snUpd.length?'<button class="btn" type="button" data-act="imp-sn">Aplicar ordem dos singles</button>':'')+(fresh.length?'<button class="btn primary" type="button" data-act="imp-go">Gravar '+fresh.length+' álbuns no catálogo</button>':'')+'</div>'+(!fresh.length&&!snUpd.length?'<p>Nada novo para gravar.</p>':''))}
async function applySn(){
  var im=state.imp;if(!im||im.busy||!im.res||!im.res.snUpd||!im.res.snUpd.length)return;
  im.busy=true;var l=im.res.snUpd,n=0;
  for(var i=0;i<l.length;i+=8){await Promise.all(l.slice(i,i+8).map(function(a){return persist(a).then(function(){n++})}));impOut('<p>Aplicando singles: '+Math.min(i+8,l.length)+' de '+l.length+'</p>')}
  im.busy=false;im.res.snUpd=[];impOut('<p><b>'+n+'</b> álbuns atualizados com a ordem dos singles.</p>');render();toast(n+' álbuns atualizados.')}
async function writeImport(){
  var im=state.imp;if(!im||im.busy||!im.res||!im.res.fresh.length)return;
  im.busy=true;var list=im.res.fresh,n=0,bad=0,base=Date.now(),ids=new Set();
  for(var i=0;i<list.length&&!im.cancel;i++){
    var src=list[i],id='i'+hashStr(albumKey(src)).toString(36);
    while(ids.has(id))id+='x';ids.add(id);
    var a=normAlbum({titulo:src.titulo,artista:src.artista,ano:src.ano,faixas:src.faixas,cor:hashColor(src.titulo+src.artista),estilo:ESTMAP[norm(src.artista)]||'',src:src.src||'',criado:base+i},id);
    var ok=false;
    for(var t=0;t<3&&!ok;t++){
      try{
        upsert(a);
        if(state.mode==='cloud'){var d=clone(a);delete d.id;await enqueue(a.id,function(){return col.doc(a.id).set(d)})}
        ok=true}
      catch(e){await new Promise(function(r){setTimeout(r,1200*(t+1))})}}
    if(ok)n++;else bad++;
    if(i%5===0||i===list.length-1)impOut('<p>Gravando álbuns: '+(i+1)+' de '+list.length+'</p><div class="bar"><i style="width:'+Math.round((i+1)/list.length*100)+'%"></i></div>')}
  if(state.mode!=='cloud')saveLocal();
  im.busy=false;
  impOut('<p><b>'+n+'</b> álbuns gravados'+(bad?', <span class="err">'+bad+' falharam (rode de novo para tentar só esses)</span>':'')+'.</p>');
  state.view={t:'artistas'};render();toast(n+' álbuns importados.')}

/* ---------- início ---------- */
function useLocal(){state.mode='local';state.canEdit=true;state.lanc=loadLocalList('lanc');state.ouvir=loadLocalList('ouvir');state.albums=loadLocal();state.fotos=loadFotosLocal();state.loading=false;render()}
async function init(){
  try{state.cforma=localStorage.getItem('minha-discoteca:cforma')==='round'?'round':'sq'}catch(e){}
  try{state.forma=localStorage.getItem('minha-discoteca:forma')==='square'?'square':'round';state.aView=localStorage.getItem('minha-discoteca:aview')==='lista'?'lista':'capas';var cc=+localStorage.getItem('minha-discoteca:cols');if(cc===3||cc===4||cc===6)state.cols=cc}catch(e){}
  render();
  var db=null,user=null,uid=null;
  try{
    if(window.claude&&window.claude.use){
      db=await window.claude.use('db');
      user=await window.claude.use('user');
      uid=user?await user.id():null}
  }catch(e){}
  if(db){
    try{
      state.canEdit=user?await user.canEdit():true;
      col=db.collection('albums');fcol=db.collection('artistas');state.mode='cloud';
      lcols.lanc=db.collection('lancamentos');lcols.ouvir=db.collection('ouvir');
      ['lanc','ouvir'].forEach(function(k){lcols[k].onSnapshot(function(snap){state[k]=snap.docs.map(function(d){return normItem(k,d.data(),d.id)});if(!state.loading)render()},function(){})});
      if(uid&&state.canEdit){
        try{var priv=db.collection('data/users/'+uid),ps=await priv.get();
          for(var i=0;i<ps.docs.length;i++){var d=ps.docs[i];await col.doc(d.id).set(d.data());await priv.doc(d.id).delete()}}catch(e){}}
      fcol.onSnapshot(function(snap){
        var o={};snap.docs.forEach(function(d){var x=d.data();if(x&&typeof x.k==='string'&&typeof x.foto==='string'&&x.foto.indexOf('data:image/')===0)o[x.k]=x.foto});
        state.fotos=o;if(!state.loading)render()},function(){});
      col.onSnapshot(function(snap){
        state.albums=snap.docs.map(function(d){return normAlbum(d.data(),d.id)});
        state.loading=false;render()},
        function(){useLocal()});
      return}
    catch(e){}}
  useLocal();
}
init();
})();
</script>
